<!doctype html>
<html>
  <head>
    <title>CRM Login</title>
    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <!-- Left side -->

      <div class="left">
        <div class="form-box">
          <h1>Welcome to our CRM.<br />Sign In to see latest updates.</h1>
          <p>Enter your details to proceed further</p>

          <div class="input-box">
            <label>Full name</label>
            <input type="text" value="Craft UI" />
            <img src="/Sign-Up page/images/profile.svg" class="icon" />
          </div>

          <div class="input-box">
            <label>Email</label>
            <input type="email" value="support@craftui.com" />
            <img src="/Sign-Up page/images/mail.svg" class="icon" />
          </div>

          <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Start typing..." />
            <img src="/Sign-Up page/images/password.svg" class="icon" />
          </div>

          <label class="custom-radio">
            <span class="outer-circle">
              <span class="inner-circle"></span>
            </span>

            <span class="label-text">I agree with terms & conditions</span>
          </label>

          <div class="buttons">
            <button class="signup">Sign Up</button>
            <button class="signin">Sign In</button>
          </div>

          <div class="social">
            <p>Or sign in with</p>
            <button>
              <img src="/Sign-Up page/images/Twitter.png" />
            </button>
            <button>
              <img src="/Sign-Up page/images/Google.png" />
            </button>
            <button>
              <img src="/Sign-Up page/images/Facebook.png" />
            </button>
          </div>
        </div>
      </div>

      <!-- Right side -->

      <div class="right">
        <img src="/Sign-Up page/images/Frame 9.jpg" />
      </div>
    </div>
  </body>
</html>
