<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CRM Login</title>

  <link rel="stylesheet" href="login style.css">
 
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"href="https://fonts.gstatic.com"crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"rel="stylesheet">


<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

   
</head>

<body>

  <div class="container">

    

    <div class="left-container">

      <div class="login-content">
        <form class="login-form">

        <h1 class="left-heading">
          Welcome to our CRM.<br>
          Sign In to see latest updates.
        </h1>

        <p class="left-description">
          Enter your details to proceed further
        </p>

        

          <div class="input-box">

            <label for="email">Email</label>

            <div class="input-field">

              <input
                type="email"
                id="email"
                placeholder="john.doe@gmail.com"
              >

              <i class="fa-regular fa-envelope-open"></i>

            </div>

          </div>

         

          <div class="input-box">

            <label for="password">Password</label>

            <div class="input-field">

              <input
                type="password"
                id="password"
                placeholder="Start typing…"
              >

              <i class="fa-solid fa-lock"></i>

            </div>

          </div>

          

          <div class="options">

            <label class="remember">

              <input
                type="radio"
                name="remember"
                checked
              >

              <span>Remember me</span>

            </label>

            <a href="#">Recover password</a>

          </div>

          

          <div class="button-group">

            <button
              type="submit"
              class="sign-in-btn"
            >
              Sign In
            </button>

            <button
              type="button"
              class="sign-up-btn"
            >
              Sign Up
            </button>

          </div>

        </form>

       
        <div class="social-login">

          <p>Or sign in with</p>

          <div class="social-icons">

            <a href="#" class="icon" aria-label="Sign in with Twitter">
              <i class="fa-brands fa-twitter"></i>
            </a>

            <a href="#" class="icon" aria-label="Sign in with Google">
              <i class="fa-brands fa-google"></i>
            </a>

            <a href="#" class="icon" aria-label="Sign in with Facebook">
              <i class="fa-brands fa-facebook-f"></i>
            </a>

          </div>

        </div>

      </div>

    </div>

   

   <div class="right-container">

      <img src="images/Gradient bg.png"alt=""class="gradient-image">

      <img src="images/Image.png"alt="CRM login illustration"class="right-image">

    </div>

  </div>

</body>

</html>
